[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Make the project importable (so `import database` works) from env.py.
prepend_sys_path = .

# Default database URL for the SQLite MVP. Override at runtime with the
# DATABASE_URL environment variable (see alembic/env.py) to target
# PostgreSQL or MySQL instead, e.g.:
#   DATABASE_URL=postgresql+psycopg://user:pass@host/dbname alembic upgrade head
sqlalchemy.url = sqlite:///./llm_platform.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S